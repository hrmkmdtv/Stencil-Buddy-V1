<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stencil Art Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Stencil</h1>
        <div class="upload-section">
            <input type="file" id="imageInput" accept="image/*">
            <label for="imageInput" class="upload-btn">Choose Image</label>
        </div>
        <div class="canvas-container">
            <div class="canvas-wrapper">
                <h3>Original Image</h3>
                <canvas id="originalCanvas"></canvas>
            </div>
            <div class="canvas-wrapper">
                <h3>Processed Image</h3>
                <canvas id="outputCanvas"></canvas>
            </div>
        </div>
        <div class="effect-controls">
            <div class="effect-group">
                <div class="effects-list" id="activeEffects">
                    <!-- Active effects will be added here -->
                </div>
                <div class="add-effect">
                    <select id="effectSelect" title="Select effect type" aria-label="Select effect type">
                    <option value="threshold">Threshold</option>
                    <option value="edge">Edge Detection</option>
                    <option value="dots">Dots</option>
                    <option value="sketch">Sketch</option>
                    <option value="ascii">ASCII Art</option>
                    <option value="lines">Horizontal Lines</option>
                    <option value="glitch">Glitch Effect</option>
                    <option value="halftone">Halftone Dots</option>
                    <option value="airbrush">Airbrush</option>
                    <option value="depthmap">Depth Map</option>
                    <option value="normalmap">Normal Map</option>
                    <option value="removebg">Remove Background</option>
                    </select>
                    <button onclick="addEffect()" class="add-btn">Add Effect</button>
                </div>
                <div id="sliderControls">
                    <div class="slider-group threshold-controls">
                        <label>Threshold: <span id="thresholdValue">128</span></label>
                        <input type="range" id="thresholdSlider" min="0" max="255" value="128" title="Adjust threshold level" aria-label="Adjust threshold level">
                    </div>
                    <div class="slider-group edge-controls">
                        <label>Sensitivity: <span id="edgeValue">50</span></label>
                        <input type="range" id="edgeSensitivity" min="0" max="100" value="50" title="Adjust edge detection sensitivity" aria-label="Adjust edge detection sensitivity">
                    </div>
                    <div class="slider-group dots-controls">
                        <label>Dot Size: <span id="dotSizeValue">8</span></label>
                        <input type="range" id="dotSizeSlider" min="4" max="20" value="8" title="Adjust dot size" aria-label="Adjust dot size">
                    </div>
                    <div class="slider-group sketch-controls">
                        <label>Contrast: <span id="sketchValue">1</span></label>
                        <input type="range" id="sketchContrast" min="0.5" max="2" value="1" step="0.1" title="Adjust sketch contrast" aria-label="Adjust sketch contrast">
                    </div>
                    <div class="slider-group ascii-controls">
                        <label>Resolution: <span id="asciiValue">8</span></label>
                        <input type="range" id="asciiResolution" min="4" max="16" value="8" title="Adjust ASCII resolution" aria-label="Adjust ASCII resolution">
                        <label>Density: <span id="asciiDensityValue">1</span></label>
                        <input type="range" id="asciiDensity" min="0.5" max="2" value="1" step="0.1" title="Adjust ASCII density" aria-label="Adjust ASCII density">
                    </div>
                    <div class="slider-group lines-controls">
                        <label>Line Spacing: <span id="lineSpacingValue">5</span></label>
                        <input type="range" id="lineSpacing" min="2" max="20" value="5" title="Adjust line spacing" aria-label="Adjust line spacing">
                        <label>Line Thickness: <span id="lineThicknessValue">2</span></label>
                        <input type="range" id="lineThickness" min="1" max="10" value="2" title="Adjust line thickness" aria-label="Adjust line thickness">
                    </div>
                    <div class="slider-group glitch-controls">
                        <label>Intensity: <span id="glitchIntensityValue">5</span></label>
                        <input type="range" id="glitchIntensity" min="1" max="20" value="5" title="Adjust glitch intensity" aria-label="Adjust glitch intensity">
                        <label>Layers: <span id="glitchLayersValue">3</span></label>
                        <input type="range" id="glitchLayers" min="1" max="5" value="3" title="Adjust glitch layers" aria-label="Adjust glitch layers">
                    </div>
                    <div class="slider-group halftone-controls">
                        <label>Size: <span id="halftoneValue">6</span></label>
                        <input type="range" id="halftoneSize" min="4" max="20" value="6" title="Adjust halftone size" aria-label="Adjust halftone size">
                        <label>Angle: <span id="halftoneAngleValue">45</span></label>
                        <input type="range" id="halftoneAngle" min="0" max="90" value="45" title="Adjust halftone angle" aria-label="Adjust halftone angle">
                    </div>
                    <div class="slider-group airbrush-controls">
                        <label>Spray Size: <span id="sprayValue">10</span></label>
                        <input type="range" id="spraySize" min="5" max="30" value="10" title="Adjust spray size" aria-label="Adjust spray size">
                        <label>Density: <span id="sprayDensityValue">30</span></label>
                        <input type="range" id="sprayDensity" min="10" max="100" value="30" title="Adjust spray density" aria-label="Adjust spray density">
                    </div>
                    <div class="slider-group depthmap-controls">
                        <label>Contrast: <span id="depthContrastValue">1</span></label>
                        <input type="range" id="depthContrast" min="0.5" max="2" value="1" step="0.1" title="Adjust depth contrast" aria-label="Adjust depth contrast">
                        <label>Brightness: <span id="depthBrightnessValue">0</span></label>
                        <input type="range" id="depthBrightness" min="-100" max="100" value="0" title="Adjust depth brightness" aria-label="Adjust depth brightness">
                    </div>
                    <div class="slider-group normalmap-controls">
                        <label>Strength: <span id="normalStrengthValue">1</span></label>
                        <input type="range" id="normalStrength" min="0.1" max="5" value="1" step="0.1" title="Adjust normal map strength" aria-label="Adjust normal map strength">
                        <label>Detail: <span id="normalDetailValue">1</span></label>
                        <input type="range" id="normalDetail" min="1" max="5" value="1" title="Adjust normal map detail" aria-label="Adjust normal map detail">
                    </div>
                    <div class="slider-group removebg-controls">
                        <label>Threshold: <span id="bgThresholdValue">128</span></label>
                        <input type="range" id="bgThreshold" min="0" max="255" value="128" title="Adjust background removal threshold" aria-label="Adjust background removal threshold">
                        <label>Tolerance: <span id="bgToleranceValue">30</span></label>
                        <input type="range" id="bgTolerance" min="0" max="100" value="30" title="Adjust background removal tolerance" aria-label="Adjust background removal tolerance">
                    </div>
                </div>
            </div>
            <div class="color-controls">
                <div class="color-mode">
                    <label>
                        <input type="radio" name="colorMode" value="single" checked> Single Color
                    </label>
                    <label>
                        <input type="radio" name="colorMode" value="multi"> Multi Color
                    </label>
                </div>
                <div class="color-pickers">
                    <div class="single-color">
                        <label>Stencil Color:</label>
                        <input type="color" id="singleColorPicker" value="#000000" title="Choose stencil color" aria-label="Choose stencil color">
                    </div>
                    <div class="multi-color">
                        <label>Dark Color:</label>
                        <input type="color" id="darkColorPicker" value="#000000" title="Choose dark color" aria-label="Choose dark color">
                        <label>Light Color:</label>
                        <input type="color" id="lightColorPicker" value="#ffffff" title="Choose light color" aria-label="Choose light color">
                    </div>
                </div>
            </div>
            <button onclick="applyEffects()" class="apply-btn">Apply Effects</button>
            <button onclick="downloadImage()" class="download-btn">Download</button>
        </div>
        <footer class="app-footer">
            Made with <span class="heart">❤️</span> by Indras Net Labs 2024
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
